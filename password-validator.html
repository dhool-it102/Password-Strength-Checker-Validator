<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 4 Assignment: Password Validator</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }

        .strength-container { margin: 0.5rem 0 1rem 0; }
        .strength-text { font-weight: bold; }
        .strength-bar { height: 6px; width: 100%; background: #e9ecef; border-radius: 3px; margin-top: 0.25rem; position: relative; }
        .strength-fill { height: 100%; width: 0%; border-radius: 3px; transition: width 0.3s, background-color 0.3s; }

        .checklist { list-style: none; padding: 0; margin: 0.5rem 0; font-size: 0.9rem; }
        .checklist li { margin-bottom: 0.25rem; color: #dc3545; }
        .checklist li.valid { color: #28a745; }

        .match-feedback { font-weight: 600; font-size: 0.95rem; margin-top: 0.5rem; }
        .text-danger { color: #dc3545; }
        .text-success { color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create Account</h2>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password">

            <div class="strength-container">
                <span>Strength: <span id="strengthText" class="strength-text">Empty</span></span>
                <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
            </div>

            <ul class="checklist">
                <li id="ruleLength">✖ At least 8 characters</li>
                <li id="ruleNumber">✖ Contains a number (0-9)</li>
                <li id="ruleSpecial">✖ Contains a special character (!@#$%^&*)</li>
            </ul>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
            <div id="matchResult" class="match-feedback"></div>
        </div>
    </div>

    <script>
        // ---- Step 1: AI-generated rule-checking function ----
        function checkPasswordRules(passwordString) {
            let hasMinLength = passwordString.length >= 8;
            let hasNumber = false;
            let hasSpecial = false;
            const specialChars = "!@#$%^&*";

            for (let i = 0; i < passwordString.length; i++) {
                let char = passwordString[i];

                if (char >= '0' && char <= '9') {
                    hasNumber = true;
                }

                if (specialChars.indexOf(char) !== -1) {
                    hasSpecial = true;
                }
            }

            return {
                hasMinLength: hasMinLength,
                hasNumber: hasNumber,
                hasSpecial: hasSpecial
            };
        }

        // ---- Step 2: Connect logic to the live form ----

        function updateRuleVisual(elementId, isValid, ruleText) {
            const el = document.getElementById(elementId);
            if (isValid) {
                el.textContent = '✓ ' + ruleText;
                el.classList.add('valid');
            } else {
                el.textContent = '✖ ' + ruleText;
                el.classList.remove('valid');
            }
        }

        function updateStrength(password, passedCount) {
            const strengthText = document.getElementById('strengthText');
            const strengthFill = document.getElementById('strengthFill');

            if (password.length === 0) {
                strengthText.textContent = 'Empty';
                strengthFill.style.width = '0%';
                strengthFill.style.backgroundColor = '#e9ecef';
            } else if (passedCount <= 1) {
                strengthText.textContent = 'Weak';
                strengthFill.style.width = '33%';
                strengthFill.style.backgroundColor = '#dc3545';
            } else if (passedCount === 2) {
                strengthText.textContent = 'Medium';
                strengthFill.style.width = '66%';
                strengthFill.style.backgroundColor = '#ffc107';
            } else if (passedCount === 3) {
                strengthText.textContent = 'Strong';
                strengthFill.style.width = '100%';
                strengthFill.style.backgroundColor = '#28a745';
            }
        }

        function updateMatchStatus(password, confirmPassword) {
            const matchResult = document.getElementById('matchResult');

            // Edge case: don't show a success (or failure) message if either field is empty.
            if (password === '' || confirmPassword === '') {
                matchResult.textContent = '';
                matchResult.className = 'match-feedback';
            } else if (password === confirmPassword) {
                matchResult.textContent = '✓ Passwords match';
                matchResult.className = 'match-feedback text-success';
            } else {
                matchResult.textContent = '✖ Passwords do not match';
                matchResult.className = 'match-feedback text-danger';
            }
        }

        function handleValidation() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const rules = checkPasswordRules(password);

            updateRuleVisual('ruleLength', rules.hasMinLength, 'At least 8 characters');
            updateRuleVisual('ruleNumber', rules.hasNumber, 'Contains a number (0-9)');
            updateRuleVisual('ruleSpecial', rules.hasSpecial, 'Contains a special character (!@#$%^&*)');

            let passedCount = 0;
            if (rules.hasMinLength) passedCount++;
            if (rules.hasNumber) passedCount++;
            if (rules.hasSpecial) passedCount++;

            updateStrength(password, passedCount);
            updateMatchStatus(password, confirmPassword);
        }

        document.getElementById('password').addEventListener('input', handleValidation);
        document.getElementById('confirmPassword').addEventListener('input', handleValidation);
    </script>
</body>
</html>
